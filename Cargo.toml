[package]
name = "jimmy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui_glow = "0.37.0"
env_logger = "0.11.11"
gilrs = "0.11.2"
libc = "0.2.191"
libmpv2 = "7.0.1"
log = "0.4.35"
nucleo-matcher = "0.3.1"
png = "0.18.1"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
