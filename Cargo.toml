[package]
name = "jimmy"
version = "0.1.0"
edition = "2024"
description = "Lightweight, gamepad-friendly media player for old hardware (Rust, egui, libmpv)"
license = "MIT"
repository = "https://github.com/owallzz/jimmy"
readme = "README.md"
keywords = ["media-player", "mpv", "gamepad", "egui", "linux"]
categories = ["multimedia::video"]
publish = false

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui_glow = "0.37.0"
env_logger = "0.11.11"
gilrs = "0.11.2"
jpeg-decoder = { version = "0.3", default-features = false }
libc = "0.2.191"
libmpv2 = "7.0.1"
libmpv2-sys = "4"
log = "0.4.35"
nucleo-matcher = "0.3.1"
png = "0.18.1"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.2.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

[dev-dependencies]
libmpv2-sys = "4"
